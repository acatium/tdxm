metrics:
- name: first_pass_yield
  description: Share of completed tasks accepted without being reversed, reopened or reassigned.
  datatype: Decimal
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN tasks.outcome_status = 'accepted' THEN 1.0 ELSE 0.0 END)
- name: reversal_rate
  description: Share of completed tasks reversed within their window.
  datatype: Decimal
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN tasks.outcome_status = 'reversed' THEN 1.0 ELSE 0.0 END)
- name: agent_share
  description: Share of tasks performed by agents rather than people.
  datatype: Decimal
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN actors.actor_kind = 'agent' THEN 1.0 ELSE 0.0 END)
- name: orphan_actions
  description: Number of observed actions with no request.
  datatype: Decimal
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COALESCE(SUM(CASE WHEN actions.request IS NULL THEN 1 ELSE 0 END), 0)
- name: stops
  description: Number of steps halted by an authority outside the performer.
  datatype: Decimal
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COALESCE(SUM(CASE WHEN events.kind = 'stopped' THEN 1 ELSE 0 END), 0)
