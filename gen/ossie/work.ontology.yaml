- concept: ContosoApprovalRule
  type: EntityType
  description: Contoso's approval rule. Can be limited to the financial year-end close, when finance data needs
    a second approver. That rule used to live in a platform script and acts once a year, which is why usage data
    alone says it is dead.
  extends:
  - ApprovalRule
  relationships:
  - name: year_end_close_days
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{ContosoApprovalRule} has year end close days- {Integer}'
- concept: ApprovalRule
  type: EntityType
  description: Who must approve a request, and when. Declared once, compiled into the platform that holds the requests,
    and checked by the replay against what the platform actually did.
  identify_by:
