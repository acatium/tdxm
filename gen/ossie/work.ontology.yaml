  - name: privilege
    roles:
    - concept: Privilege
    multiplicity: ManyToOne
    verbalizes:
    - '{Grant} has privilege- {Privilege}'
  - name: held_in
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Grant} has held in- {String}'
  - name: granted_at
    roles:
    - concept: DateTime
    multiplicity: ManyToOne
    verbalizes:
