- concept: Confirmation
  type: EntityType
  description: 'A person''s decision on a proposed change: a repair, a declared policy or an autonomy promotion.
    Nothing proposed is applied without one. Bound to the proposal''s content by a digest in its id, so a changed
    proposal needs a new confirmation. In a deployment, written by a person; a demo may write labelled stand-ins.'
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{Confirmation} is identified by {String}'
  - name: change_kind
    roles:
    - concept: ChangeKind
    multiplicity: ManyToOne
    verbalizes:
    - '{Confirmation} has change kind- {ChangeKind}'
  - name: verdict
    roles:
    - concept: Verdict
    multiplicity: ManyToOne
    verbalizes:
    - '{Confirmation} has verdict- {Verdict}'
  - name: decided_by
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Confirmation} has decided by- {String}'
  - name: decided_at
    roles:
    - concept: DateTime
    multiplicity: ManyToOne
    verbalizes:
    - '{Confirmation} has decided at- {DateTime}'
  - name: reason
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Confirmation} has reason- {String}'
