  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{AccessPolicy} is identified by {String}'
  - name: description
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccessPolicy} has description- {String}'
  - name: role
    roles:
    - concept: Role
    multiplicity: ManyToOne
    verbalizes:
    - '{AccessPolicy} has role- {Role}'
  - name: domain
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccessPolicy} has domain- {String}'
  - name: max_classification
    roles:
