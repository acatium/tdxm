version: 0.2.0.dev0
name: Work
description: Concepts of the work vocabulary, generated from LinkML. Do not edit by hand.
prefixes:
  work: https://example.org/work/
  access: https://example.org/work/access/
  org: https://example.org/contoso/
ontology:
- concept: ActorKind
  type: ValueType
  extends:
  - String
  description: One of person, agent, service_account, system.
  requires:
  - ActorKind == 'person' OR ActorKind == 'agent' OR ActorKind == 'service_account' OR ActorKind == 'system'
- concept: ApproverKind
  type: ValueType
  extends:
  - String
  description: One of dataset_owner, role.
  requires:
  - ApproverKind == 'dataset_owner' OR ApproverKind == 'role'
- concept: AutonomyLevel
  type: ValueType
  extends:
  - String
  description: The earned autonomy ladder. Promotion follows evidence; demotion is immediate.
  requires:
  - AutonomyLevel == 'assist' OR AutonomyLevel == 'act_with_checkpoint' OR AutonomyLevel == 'act' OR AutonomyLevel
    == 'act_and_report'
- concept: ChangeKind
  type: ValueType
  extends:
  - String
  description: The three things whose change is earned on evidence.
  requires:
  - ChangeKind == 'repair' OR ChangeKind == 'declared_policy' OR ChangeKind == 'autonomy'
- concept: Classification
  type: ValueType
  extends:
  - String
  description: Ordered from least to most sensitive.
  requires:
  - Classification == 'public' OR Classification == 'internal' OR Classification == 'confidential' OR Classification
    == 'restricted'
- concept: CleanupPlan
  type: ValueType
  extends:
  - String
  description: One of retire, revert_to_base, declare, replace_with_adapter, keep.
  requires:
  - CleanupPlan == 'retire' OR CleanupPlan == 'revert_to_base' OR CleanupPlan == 'declare' OR CleanupPlan == 'replace_with_adapter'
    OR CleanupPlan == 'keep'
- concept: CustomisationKind
  type: ValueType
  extends:
  - String
  description: One of catalogue_item, business_rule, client_script, custom_field, approval_rule.
  requires:
  - CustomisationKind == 'catalogue_item' OR CustomisationKind == 'business_rule' OR CustomisationKind == 'client_script'
    OR CustomisationKind == 'custom_field' OR CustomisationKind == 'approval_rule'
- concept: DecisionEffect
  type: ValueType
  extends:
  - String
  description: One of allow, deny, checkpoint.
  requires:
  - DecisionEffect == 'allow' OR DecisionEffect == 'deny' OR DecisionEffect == 'checkpoint'
- concept: GapKind
  type: ValueType
  extends:
  - String
  description: One of orphan_action, idle_privilege, unregistered_actor, policy_candidate, duplicate_definition,
    dead_customisation, drift, vocabulary.
  requires:
  - GapKind == 'orphan_action' OR GapKind == 'idle_privilege' OR GapKind == 'unregistered_actor' OR GapKind == 'policy_candidate'
    OR GapKind == 'duplicate_definition' OR GapKind == 'dead_customisation' OR GapKind == 'drift' OR GapKind ==
    'vocabulary'
- concept: OutcomeStatus
  type: ValueType
  extends:
  - String
  description: One of accepted, reversed, reopened, reassigned, failed, abandoned.
  requires:
  - OutcomeStatus == 'accepted' OR OutcomeStatus == 'reversed' OR OutcomeStatus == 'reopened' OR OutcomeStatus ==
    'reassigned' OR OutcomeStatus == 'failed' OR OutcomeStatus == 'abandoned'
- concept: Privilege
  type: ValueType
  extends:
  - String
  description: One of read, write, admin.
  requires:
  - Privilege == 'read' OR Privilege == 'write' OR Privilege == 'admin'
- concept: RiskClass
  type: ValueType
  extends:
  - String
  description: One of low, medium, high.
  requires:
  - RiskClass == 'low' OR RiskClass == 'medium' OR RiskClass == 'high'
- concept: Verdict
  type: ValueType
  extends:
  - String
  description: One of approve, reject.
  requires:
  - Verdict == 'approve' OR Verdict == 'reject'
- concept: WorkEventKind
  type: ValueType
  extends:
  - String
  description: One of requested, decided, started, stopped, approved, rejected, overridden, completed, reversed,
    promoted, demoted.
  requires:
  - WorkEventKind == 'requested' OR WorkEventKind == 'decided' OR WorkEventKind == 'started' OR WorkEventKind ==
    'stopped' OR WorkEventKind == 'approved' OR WorkEventKind == 'rejected' OR WorkEventKind == 'overridden' OR
    WorkEventKind == 'completed' OR WorkEventKind == 'reversed' OR WorkEventKind == 'promoted' OR WorkEventKind
    == 'demoted'
- concept: Role
  type: EntityType
  description: A kind of person or agent, by job. Policy is written over roles, never over individuals.
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{Role} is identified by {String}'
  - name: name
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Role} has name- {String}'
  - name: department
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Role} has department- {String}'
